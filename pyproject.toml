[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpo2g"
version = "0.1.0"
authors = [{ name = "Nick Brosnahan", email = "nbrosnahan@gmail.com" }]
description = "Uploads Omron Blood Pressure reports in CSV-format to Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.4.1",
    # garminconnect 0.3.x logs in via a Cloudflare-aware strategy chain
    # (mobile + SSO-embed-widget + portal, all over curl_cffi) and persists a
    # token session — so bpo2g needs no custom SSO code. curl_cffi comes in
    # transitively as a garminconnect dependency.
    "garminconnect>=0.3.5",
    # Bootstrap-only: loads GARMIN_USERNAME/GARMIN_PASSWORD from a .env file.
    "python-dotenv>=1.0.0",
]

[project.scripts]
bpo2g = "bpo2g:main"

[project.urls]
"Homepage" = "https://github.com/nbrosnahan/bpo2g"
"Bug Tracker" = "https://github.com/nbrosnahan/bpo2g/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-randomly>=3.15",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "types-requests>=2.32",
    "build>=1.2",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["bpo2g"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bpo2g"]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--durations=25",
    "--durations-min=0.5",
    "-ra",
    "--junitxml=.pytest-results.xml",
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["garminconnect.*"]
ignore_missing_imports = true
